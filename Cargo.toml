[package]
name = "bio_files"
version = "0.5.5"
edition = "2024"
authors = ["David O'Connor <the_alchemist@fastmail.com>"]
description = "Save and load common biology file formats"
keywords = ["dynamics", "molecule", "biology"]
categories = [
    "science::bioinformatics::genomics",
    "science::bioinformatics::proteomics",
    "science::bioinformatics::sequence-analysis",
    "science::computational-biology::structural-modeling",
    "science::computational-chemistry::cheminformatics",
]
repository = "https://github.com/David-OConnor/bio_files"
documentation = "https://docs.rs/bio_files"
readme = "README.md"
license = "MIT"
exclude = [".gitignore"]


[dependencies]
byteorder = "1.5.0"  # For use with some parsers.
na_seq = "0.3.16"  # Element, atom etc primitives
bio_apis = "0.3.0" # Loading data from RCSB etc.
lin_alg = "1.4.3"
regex = "1.13"
# For parsing and writing GenBank files.
gb-io = "0.9.0"
# For the XML packets in SnapGene files.
quick-xml = { version = "0.42", features = ["serialize"] }
serde = { version = "1.0", features = ["derive"] }

# These are for converting 2fo-fc files to map (electron density)
#num-complex = "0.4.6"
#rustfft = "6.4.0"

bincode = { version = "2.0.1", optional = true }
rayon = "1.11.0"  # Optional [de]serializing
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
rustfft = "6.4"  # For the electron density example.

[patch.crates-io]
#na_seq = { path = "../na_seq" }
#lin_alg = { path = "../../lin_alg" }


[features]
encode = ["bincode"]
